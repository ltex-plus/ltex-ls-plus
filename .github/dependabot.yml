version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Kotlin version is updated manually when CodeQL supports the new release.
    # CodeQL's Kotlin extractor (code-scanning autobuild) rejects newer versions:
    # "Kotlin version X is too recent. CodeQL currently supports versions below Y".
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
    assignees:
      - "spitzerd"
    labels:
      - "pr-dependabot 🤖"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    assignees:
      - "spitzerd"
    labels:
      - "pr-dependabot 🤖"
