version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
    # CodeQL's Kotlin extractor (code-scanning autobuild) only supports Kotlin
    # versions below 2.3.30. Bumping past that (2.4.0 broke develop) fails the
    # CodeQL build with KotlinVersionTooRecentError. Hold Kotlin back until the
    # CodeQL extractor supports the newer release; revisit then.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
    assignees:
      - "spitzerd"
    labels:
      - "pr-dependabot 🤖"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    assignees:
      - "spitzerd"
    labels:
      - "pr-dependabot 🤖"
